name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité, tests et build
    runs-on: ubuntu-latest

    # Les tests de bout en bout vérifient le cloisonnement contre une vraie
    # base : la règle vit dans la requête SQL, et un Prisma simulé ne prouverait
    # rien. Même image majeure que docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: probo
          POSTGRES_PASSWORD: probo
          POSTGRES_DB: probo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U probo -d probo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://probo:probo@localhost:5433/probo?schema=public
      # Secret d'intégration continue : il ne signe que des sessions de test,
      # jetées avec le conteneur. Le secret de production vit chez l'hébergeur.
      JWT_SECRET: ci-secret-de-test-sans-valeur-hors-integration-continue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Les contrats partagés doivent être construits avant que l'API et le
      # front puissent les typer.
      - name: Construire les contrats partagés
        run: npm run build -w @probo/shared

      - name: Valider le schéma Prisma
        run: npx prisma validate
        working-directory: apps/api

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Appliquer les migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Tests
        run: npm test

      # Sans cette étape, le test qui a attrapé la disparition silencieuse du
      # cloisonnement ne serait protégé par rien : `npm test` ne lance que les
      # tests unitaires, dont la racine est src/.
      - name: Tests de bout en bout
        run: npm run test:e2e -w @probo/api

      # Remplace une étape de build : la recette construit tout, puis démarre
      # le binaire construit et le serveur de développement et entre par la
      # porte, comme un utilisateur. Les tests ci-dessus appellent l'API dans
      # le même processus — ils ne construisent rien, n'ouvrent aucun port et
      # ne passent par aucune passerelle. Quatre défauts ont vécu dans cet
      # angle mort le 03/11/2026.
      - name: Build et recette
        run: npm run recette
