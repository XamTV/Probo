<main class="mx-auto flex min-h-dvh max-w-2xl flex-col justify-center gap-6 px-6">
  <header class="flex flex-col gap-2">
    <p class="font-mono text-xs uppercase tracking-widest text-slate-500">Socle technique</p>
    <h1 class="text-4xl font-semibold tracking-tight text-slate-900">{{ titre() }}</h1>
    <p class="text-slate-600">{{ baseline() }}</p>
  </header>

  <section class="rounded border border-slate-200 bg-white p-4">
    <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-slate-500">
      Contrats partagés
    </h2>
    <p class="text-sm text-slate-600">
      Le front consomme <code class="font-mono text-slate-900">&#64;probo/shared</code>, qui porte
      les schémas Zod et les règles de gestion. Types attendus par défaut :
    </p>
    <ul class="mt-3 flex flex-wrap gap-2">
      @for (type of typesDocument; track type) {
        <li class="rounded bg-slate-100 px-2 py-1 font-mono text-xs text-slate-700">{{ type }}</li>
      }
    </ul>
  </section>

  <router-outlet />
</main>
